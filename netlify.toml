[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API antes del SPA fallback
[[redirects]]
  from = "/api/ocr-placa"
  to = "/.netlify/functions/ocr-placa"
  status = 200

[[redirects]]
  from = "/api/patio-grok"
  to = "/.netlify/functions/patio-grok"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/movimientos"
  to = "/.netlify/functions/movimientos"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
